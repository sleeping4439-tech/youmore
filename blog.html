<style>
:root{--red:#d4000d;--cream:#f0e5df;--gold:#b98b4d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--red);color:var(--cream);font-family:Arial,"Helvetica Neue",sans-serif}
a{color:inherit}a:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.wrap{max-width:1540px;margin:auto;min-height:100vh;overflow:hidden}
.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:26px clamp(22px,5vw,72px);border-bottom:1px solid #f0e5df66}
.topbar a{text-decoration:none;font-size:13px;letter-spacing:.14em}.topbar span{font-size:11px;letter-spacing:.25em}
.hero{min-height:clamp(300px,45vw,480px);position:relative;padding:clamp(34px,5vw,80px) clamp(22px,6vw,95px);display:flex;flex-direction:column;justify-content:space-between}
.hero-number{font-family:Georgia,serif;font-size:clamp(54px,9vw,135px);line-height:1;color:var(--gold)}
.hero-main{position:relative;z-index:2;padding-top:25px}
.kanji{display:block;width:clamp(125px,25vw,340px);height:auto;filter:brightness(0) invert(1);opacity:.95}
.hero h1{font-weight:300;font-size:clamp(52px,12vw,180px);line-height:.95;letter-spacing:.1em;margin:10px 0 18px}
.hero-sub{font-size:clamp(12px,1.5vw,18px);line-height:2;letter-spacing:.12em}
.hero-art{position:absolute;right:-2%;top:0;bottom:auto;width:min(51%,680px);height:auto;pointer-events:none;z-index:1}
.hero-bottom{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:60px}
.hero-bottom span{font-size:11px;letter-spacing:.2em}
.index{position:relative;z-index:2;padding:20px clamp(22px,6vw,95px) 90px}
.index-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:20px;border-bottom:1px solid #f0e5df88}
.index-head h2{font-size:clamp(21px,3vw,36px);font-weight:400;letter-spacing:.12em;margin:0}
.index-head span{font-family:Georgia,serif;font-size:13px;color:#f0e5dfaa}
.empty{padding:clamp(40px,8vw,90px) 0;border-bottom:1px solid #f0e5df88}
.empty p{margin:0;font-size:clamp(17px,3vw,32px);font-weight:300;letter-spacing:.12em;line-height:1.8}
.empty small{display:block;margin-top:18px;font-size:12px;letter-spacing:.08em;color:#f0e5dfb5}
.foot{display:flex;justify-content:space-between;gap:20px;padding:28px clamp(22px,6vw,95px);border-top:1px solid #f0e5df66;font-size:12px;letter-spacing:.12em}
.foot a{text-decoration:none}
@media(max-width:700px){.topbar{padding:20px 22px}.hero{min-height:300px;padding:36px 24px}.hero-art{width:76%;right:-17%;top:0;bottom:auto;opacity:.82}.hero-main{margin-top:-40px}.hero h1{font-size:clamp(56px,16vw,96px)}.hero-sub{max-width:240px}.index{padding:20px 24px 80px}.hero-bottom{margin-top:90px}.foot{padding:25px 24px}}
@media(prefers-reduced-motion:no-preference){.hero-main,.hero-art{animation:appear .9s both}.hero-main{animation-delay:.12s}.hero-art{animation-delay:.28s}@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}}
.brand-logo{display:block;width:116px;height:auto}.brand-logo image{pointer-events:none}.topbar .brand-link{display:block;line-height:0}.topbar .menu-toggle{width:44px;height:44px;padding:11px;border:0;background:transparent;display:flex;flex-direction:column;justify-content:space-around;cursor:pointer;position:relative;z-index:6}.topbar .menu-toggle span{display:block;width:100%;height:1px;background:var(--cream)}.essay-menu{display:none;position:absolute;z-index:5;top:100%;right:clamp(22px,5vw,72px);width:min(290px,calc(100vw - 44px));padding:28px;background:var(--cream);color:#111;box-shadow:0 10px 30px #0003}.essay-menu.open{display:flex;flex-direction:column;gap:23px}.essay-menu a{text-decoration:none;font-size:14px;letter-spacing:.18em}.essay-menu a:hover{text-decoration:underline}@media(max-width:700px){.brand-logo{width:95px}.essay-menu{right:22px}}\n/* Match homepage ESSAY typography sizes on mobile and desktop. */

.hero-main .kanji-gen-soft::before{content:"";position:absolute;left:23%;top:12%;width:49%;height:.022em;background:currentColor;pointer-events:none}

.hero-art{top:0;bottom:auto;right:-2%;height:calc(70% + clamp(51px,7.14vw,81.6px));width:auto;max-width:none;transform:none;animation:none!important;opacity:1}
@media(max-width:700px){.hero-art{right:-17%;top:0;bottom:auto;height:calc(72% + clamp(51px,7.14vw,81.6px));width:auto;opacity:1}}

.essay-card{display:block;min-width:0;text-decoration:none}
.essay-card-image{display:block;aspect-ratio:1.35;overflow:hidden;background:#bb0010;border-radius:4px}
.essay-card-image img{display:block;width:100%;height:100%;object-fit:cover}
.essay-card-title{display:block;margin-top:14px;font-size:clamp(15px,2.4vw,26px);line-height:1.5;letter-spacing:.06em}
.essay-card-meta{display:block;margin-top:7px;font-size:11px;color:#f0e5dfb5}
@media(max-width:700px){.essay-card-grid{gap:16px}.essay-card-title{font-size:14px}.essay-card-meta{font-size:10px}}
/* Move ESSAY hero leaf artwork 30px left at all viewport widths. */
.hero-art{translate:-30px 0}

/* ESSAY page zones: cream header and article area, red MV only. */
body{background:var(--cream);color:#111}
.topbar{background:var(--cream);color:#111;border-bottom:1px solid rgba(17,17,17,.16)}
.topbar .menu-toggle span{background:#111}
.hero{background:var(--red);color:var(--cream)}
.index{background:var(--cream);color:#111}
.index-head,.empty{border-bottom-color:rgba(17,17,17,.2)}
.index-head span,.empty small,.essay-card-meta{color:#666}
.foot{background:var(--cream);color:#111;border-top:1px solid rgba(17,17,17,.16)}

/* Match the homepage kanji, reduce the MV height by 60px, and enlarge the right-anchored leaf. */
.hero{height:calc(100vw * 408 / 796 - 60px);aspect-ratio:auto;overflow:hidden}
.hero-main svg.kanji-gen-soft{color:rgba(241,167,170,.50);filter:none;opacity:1}
.hero-main svg.kanji-gen-soft::before{content:none}
.hero-art{right:0;top:0;bottom:auto;translate:none;transform:scale(1.4);transform-origin:right top;animation:none!important}
@media(min-width:701px){.hero{height:calc(min(100vw,1540px) * 660 / 1540 - 60px);aspect-ratio:auto}}

</style>
