<style>
:root{--red:#d4000d;--cream:#f0e5df;--gold:#b98b4d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--red);color:var(--cream);font-family:Arial,"Helvetica Neue",sans-serif}
a{color:inherit}a:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.wrap{max-width:1540px;margin:auto;min-height:100vh;overflow:hidden}
.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:26px clamp(22px,5vw,72px);border-bottom:1px solid #f0e5df66}
.topbar a{text-decoration:none;font-size:13px;letter-spacing:.14em}.topbar span{font-size:11px;letter-spacing:.25em}
.hero{min-height:clamp(300px,45vw,480px);position:relative;padding:clamp(34px,5vw,80px) clamp(22px,6vw,95px);display:flex;flex-direction:column;justify-content:space-between}
.hero-number{font-family:Georgia,serif;font-size:clamp(54px,9vw,135px);line-height:1;color:var(--gold)}
.hero-main{position:relative;z-index:2;padding-top:25px}
.kanji{display:block;width:clamp(125px,25vw,340px);height:auto;filter:brightness(0) invert(1);opacity:.95}
.hero h1{font-weight:300;font-size:clamp(52px,12vw,180px);line-height:.95;letter-spacing:.1em;margin:10px 0 18px}
.hero-sub{font-size:clamp(12px,1.5vw,18px);line-height:2;letter-spacing:.12em}
.hero-art{position:absolute;right:-2%;top:0;bottom:auto;width:min(51%,680px);height:auto;pointer-events:none;z-index:1}
.hero-bottom{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:60px}
.hero-bottom span{font-size:11px;letter-spacing:.2em}
.index{position:relative;z-index:2;padding:20px clamp(22px,6vw,95px) 90px}
.index-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:20px;border-bottom:1px solid #f0e5df88}
.index-head h2{font-size:clamp(21px,3vw,36px);font-weight:400;letter-spacing:.12em;margin:0}
.index-head span{font-family:Georgia,serif;font-size:13px;color:#f0e5dfaa}
.empty{padding:clamp(40px,8vw,90px) 0;border-bottom:1px solid #f0e5df88}
.empty p{margin:0;font-size:clamp(17px,3vw,32px);font-weight:300;letter-spacing:.12em;line-height:1.8}
.empty small{display:block;margin-top:18px;font-size:12px;letter-spacing:.08em;color:#f0e5dfb5}
.foot{display:flex;justify-content:space-between;gap:20px;padding:28px clamp(22px,6vw,95px);border-top:1px solid #f0e5df66;font-size:12px;letter-spacing:.12em}
.foot a{text-decoration:none}
@media(max-width:700px){.topbar{padding:20px 22px}.hero{min-height:300px;padding:36px 24px}.hero-art{width:76%;right:-17%;top:0;bottom:auto;opacity:.82}.hero-main{margin-top:-40px}.hero h1{font-size:clamp(56px,16vw,96px)}.hero-sub{max-width:240px}.index{padding:20px 24px 80px}.hero-bottom{margin-top:90px}.foot{padding:25px 24px}}
@media(prefers-reduced-motion:no-preference){.hero-main,.hero-art{animation:appear .9s both}.hero-main{animation-delay:.12s}.hero-art{animation-delay:.28s}@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}}
</style>
