<script>(()=>{const button=document.querySelector('.menu-toggle'),menu=document.querySelector('#essay-menu');const close=()=>{menu.classList.remove('open');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','メニューを開く')};button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';menu.classList.toggle('open',open);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.classList.contains('open')){close();button.focus()}});document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!button.contains(e.target))close()})})();</script></body></html>
