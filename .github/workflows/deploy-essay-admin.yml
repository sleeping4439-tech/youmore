name: Deploy ESSAY admin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'essay-publish-worker.js'
      - 'essay-auth.js'
      - 'essay-editor.html'
      - 'essay-editor.js'
      - 'wrangler.essay.jsonc'
      - 'scripts/build-essay-admin.mjs'
      - '.github/workflows/deploy-essay-admin.yml'
permissions:
  contents: read
concurrency:
  group: youmore-essay-admin-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ESSAY_GITHUB_TOKEN: ${{ secrets.ESSAY_GITHUB_TOKEN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ESSAY_ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ESSAY_ACCESS_AUD }}
      OWNER_EMAIL: ${{ vars.ESSAY_OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test
        run: |
          node scripts/build-essay-admin.mjs
          node --test tests/essay.test.mjs
      - name: Configure owner verification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='wrangler.essay.jsonc', c=JSON.parse(fs.readFileSync(p,'utf8'));
          for (const k of ['ACCESS_TEAM_DOMAIN','ACCESS_AUD','OWNER_EMAIL']) c.vars[k]=process.env[k]||'';
          fs.writeFileSync(p,JSON.stringify(c,null,2));
          NODE
      - name: Deploy locked-by-default admin
        run: npx --yes wrangler@4.156.2 deploy --config wrangler.essay.jsonc
      - name: Install publishing credential
        if: env.ESSAY_GITHUB_TOKEN != ''
        run: printf '%s' "$ESSAY_GITHUB_TOKEN" | npx --yes wrangler@4.156.2 secret put GITHUB_TOKEN --config wrangler.essay.jsonc
      - name: Check configuration status
        run: |
          if [ -z "$ESSAY_GITHUB_TOKEN" ] || [ -z "$ACCESS_TEAM_DOMAIN" ] || [ -z "$ACCESS_AUD" ] || [ -z "$OWNER_EMAIL" ]; then
            echo 'Worker deployed in locked state. Set ESSAY_GITHUB_TOKEN secret and ESSAY_ACCESS_TEAM_DOMAIN, ESSAY_ACCESS_AUD, ESSAY_OWNER_EMAIL variables, configure owner-only Cloudflare Access, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Verify owner sign-in and a controlled publication on the deployed admin before regular use.' >> "$GITHUB_STEP_SUMMARY"
          fi
