<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ESSAY EDITOR | ゆうもれ</title>
<style>
:root{--paper:#f0e5df;--ink:#201b19;--red:#d4000d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--red);outline-offset:3px}.bar{position:sticky;top:0;z-index:4;background:#f0e5dff5;border-bottom:1px solid #d3c5bd;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,4vw,40px);flex-wrap:wrap}.brand{font-size:13px;letter-spacing:.14em}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #bbaea6;border-radius:5px;padding:9px 13px;background:transparent;color:inherit;font-size:13px}.primary{background:var(--red);color:white;border-color:var(--red)}.note{background:#fff5d9;border-bottom:1px solid #e3d1a2;padding:12px clamp(16px,4vw,40px);font-size:12px;line-height:1.7}.wrap{max-width:850px;margin:45px auto 120px;padding:0 22px}.label{font-size:11px;letter-spacing:.16em;color:#8a4e4e}.mv{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1.35;background:#e3d7cf;border:1px dashed #b9aaa2;margin:18px 0 28px;overflow:hidden}.mv img{width:100%;height:100%;object-fit:cover}.mv-controls{position:absolute;bottom:12px;right:12px;background:#f0e5dfeb;padding:7px;border-radius:4px}.title{display:block;width:100%;border:0;border-bottom:1px solid #d6c9c0;background:transparent;resize:none;outline:none;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(32px,6vw,60px);line-height:1.5;padding:8px 0 18px;color:var(--ink)}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid #d6c9c0}.editor{min-height:320px;outline:none;padding:35px 0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;line-height:2.4;overflow-wrap:anywhere}.editor:empty:before{content:attr(data-placeholder);color:#978b85}.editor p{margin:0 0 1.4em}.editor h2{font-size:1.5em;line-height:1.7}.editor img{display:block;max-width:100%;height:auto;margin:24px auto}.status{font-size:12px;color:#76675f}.preview{display:none}.preview .meta{font-size:12px;color:#76675f}.preview h1{font:400 clamp(32px,6vw,60px)/1.5 "Hiragino Mincho ProN","Yu Mincho",serif}.preview .body{font:18px/2.4 "Hiragino Mincho ProN","Yu Mincho",serif}.preview img{max-width:100%}body.is-preview .edit-mode{display:none}body.is-preview .preview{display:block}@media(max-width:600px){.wrap{margin-top:26px}.bar{align-items:start}.editor{font-size:16px}.tools button{padding:8px 10px}}

/* Match published article preview: full-width visual and no gold divider. */
.preview #previewMv{width:100vw;position:relative;left:50%;transform:translateX(-50%);margin:0 0 32px}
.preview #previewMv img{display:block;width:100%;height:auto;aspect-ratio:1.35;object-fit:cover}
.preview h1{font-size:clamp(30.4px,5.6vw,62.4px)}
</style></head><body>
<div class="bar"><strong class="brand">ゆうもれ / ESSAY EDITOR</strong><div class="actions"><button id="save">下書き保存</button><button id="previewBtn">プレビュー</button><button id="export">原稿を書き出す</button><button id="importBtn">原稿を読み込む</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="primary" id="publish" disabled title="本人認証を確認中">公開する</button></div></div>
<div class="note" id="connection">本人認証を確認しています。下書きはこの端末に保存されます。</div>
<main class="wrap"><div class="edit-mode"><div class="label">MAIN VISUAL / THUMBNAIL</div><div class="mv" id="mv"><span id="mvPlaceholder">メインビジュアルを選択</span><div class="mv-controls"><button id="mvSelect">画像を選ぶ</button><button id="mvRemove">外す</button></div></div><input id="mvFile" type="file" accept="image/*" hidden><textarea aria-label="記事のタイトル" class="title" id="title" rows="2" placeholder="記事のタイトル"></textarea><div class="tools"><button data-command="bold">太字</button><button data-command="heading">見出し</button><button data-command="paragraph">本文</button><button id="linkBtn">リンク</button><button id="imageBtn">本文に画像</button><button id="undoBtn">元に戻す</button></div><input id="bodyImageFile" type="file" accept="image/*" hidden><div id="editor" class="editor" contenteditable="true" aria-label="記事本文" role="textbox" aria-multiline="true" data-placeholder="ここから文章を書き始める。"></div></div><section class="preview" id="preview"><div class="label">ESSAY / PREVIEW</div><div id="previewMv"></div><h1 id="previewTitle"></h1><p class="meta" id="previewDate"></p><div class="body" id="previewBody"></div></section><p class="status" id="status" aria-live="polite"></p></main>
<script src="essay-editor.js" defer></script></body></html>
