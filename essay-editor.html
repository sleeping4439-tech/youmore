<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ESSAY EDITOR | ゆうもれ</title>
<style>
:root{--paper:#f0e5df;--ink:#201b19;--red:#d4000d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--red);outline-offset:3px}.bar{position:sticky;top:0;z-index:4;background:#f0e5dff5;border-bottom:1px solid #d3c5bd;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,4vw,40px);flex-wrap:wrap}.brand{font-size:13px;letter-spacing:.14em}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #bbaea6;border-radius:5px;padding:9px 13px;background:transparent;color:inherit;font-size:13px}.primary{background:var(--red);color:white;border-color:var(--red)}.note{background:#fff5d9;border-bottom:1px solid #e3d1a2;padding:12px clamp(16px,4vw,40px);font-size:12px;line-height:1.7}.wrap{max-width:850px;margin:45px auto 120px;padding:0 22px}.label{font-size:11px;letter-spacing:.16em;color:#8a4e4e}.mv{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1.35;background:#e3d7cf;border:1px dashed #b9aaa2;margin:18px 0 28px;overflow:hidden}.mv img{width:100%;height:100%;object-fit:cover}.mv-controls{position:absolute;bottom:12px;right:12px;background:#f0e5dfeb;padding:7px;border-radius:4px}.title{display:block;width:100%;border:0;border-bottom:1px solid #d6c9c0;background:transparent;resize:none;outline:none;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(32px,6vw,60px);line-height:1.5;padding:8px 0 18px;color:var(--ink)}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid #d6c9c0}.editor{min-height:320px;outline:none;padding:35px 0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;line-height:2.4;overflow-wrap:anywhere}.editor:empty:before{content:attr(data-placeholder);color:#978b85}.editor p{margin:0 0 1.4em}.editor h2{font-size:1.5em;line-height:1.7}.editor img{display:block;max-width:100%;height:auto;margin:24px auto}.status{font-size:12px;color:#76675f}.preview{display:none}.preview .meta{font-size:12px;color:#76675f}.preview h1{font:400 clamp(32px,6vw,60px)/1.5 "Hiragino Mincho ProN","Yu Mincho",serif}.preview .body{font:18px/2.4 "Hiragino Mincho ProN","Yu Mincho",serif}.preview img{max-width:100%}body.is-preview .edit-mode{display:none}body.is-preview .preview{display:block}@media(max-width:600px){.wrap{margin-top:26px}.bar{align-items:start}.editor{font-size:16px}.tools button{padding:8px 10px}}
</style></head><body>
<div class="bar"><strong class="brand">ゆうもれ / ESSAY EDITOR</strong><div class="actions"><button id="save">下書き保存</button><button id="previewBtn">プレビュー</button><button id="export">原稿を書き出す</button><button class="primary" id="publish" disabled title="認証・公開APIの接続後に利用可能">公開（準備中）</button></div></div>
<div class="note">現在はエディター試作版です。ログイン認証・サーバー保存・公開機能は未接続です。下書きはこのブラウザだけに保存されます。管理者認証が完成するまで、このページに秘密情報は入力しないでください。</div>
<main class="wrap"><div class="edit-mode"><div class="label">MAIN VISUAL / THUMBNAIL</div><div class="mv" id="mv"><span id="mvPlaceholder">メインビジュアルを選択</span><div class="mv-controls"><button id="mvSelect">画像を選ぶ</button><button id="mvRemove">外す</button></div></div><input id="mvFile" type="file" accept="image/*" hidden><textarea class="title" id="title" rows="2" placeholder="記事のタイトル"></textarea><div class="tools"><button data-command="bold">太字</button><button data-command="heading">見出し</button><button data-command="paragraph">本文</button><button id="linkBtn">リンク</button><button id="imageBtn">本文に画像</button><button id="undoBtn">元に戻す</button></div><input id="bodyImageFile" type="file" accept="image/*" hidden><div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="ここから文章を書き始める。"></div></div><section class="preview" id="preview"><div class="label">ESSAY / PREVIEW</div><div id="previewMv"></div><h1 id="previewTitle"></h1><p class="meta" id="previewDate"></p><hr style="width:80px;margin:65px 0;border:0;border-top:2px solid #a77c47"><div class="body" id="previewBody"></div></section><p class="status" id="status" aria-live="polite"></p></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='youmore-essay-draft-v1';let mvData='',saveTimer;const allowedTags=new Set(['P','DIV','BR','H2','STRONG','B','EM','I','A','IMG','UL','OL','LI','BLOCKQUOTE']);
function clean(root){const copy=root.cloneNode(true);function walk(node){for(const child of [...node.childNodes]){if(child.nodeType===8){child.remove();continue}if(child.nodeType!==1)continue;const tag=child.tagName;if(!allowedTags.has(tag)){const frag=document.createDocumentFragment();while(child.firstChild)frag.appendChild(child.firstChild);child.replaceWith(frag);walk(node);continue}for(const a of [...child.attributes])child.removeAttribute(a.name);if(tag==='A'){const href=node===child?'':(root.querySelector('a')?'':'');void href}walk(child)}}walk(copy);return copy.innerHTML}
function safeHTML(html){const template=document.createElement('template');template.innerHTML=html;function walk(root){for(const el of [...root.children]){if(!allowedTags.has(el.tagName)){el.replaceWith(...el.childNodes);walk(root);continue}const href=el.getAttribute('href'),src=el.getAttribute('src');for(const attr of [...el.attributes])el.removeAttribute(attr.name);if(el.tagName==='A'&&href&&/^https?:\/\//i.test(href))el.setAttribute('href',href);if(el.tagName==='IMG'&&src&&(/^data:image\/(png|jpeg|webp);base64,/i.test(src)||/^https:\/\//i.test(src)))el.setAttribute('src',src);walk(el)}}walk(template.content);return template.innerHTML}
function state(){return{title:$('title').value,body:safeHTML($('editor').innerHTML),mv:mvData,updatedAt:new Date().toISOString()}}
function status(t){$('status').textContent=t}
function save(){try{localStorage.setItem(key,JSON.stringify(state()));status('この端末に下書きを保存しました')}catch{status('保存容量を超えました。画像を減らすか原稿を書き出してください')}}
function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,1200)}
try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){$('title').value=d.title||'';$('editor').innerHTML=safeHTML(d.body||'');mvData=d.mv||''}}catch{}
function updateMv(){const old=$('mv').querySelector('img');if(old)old.remove();$('mvPlaceholder').hidden=!!mvData;if(mvData){const img=new Image();img.src=mvData;img.alt='';$('mv').prepend(img)}}
updateMv();
function readImage(file,cb){if(!file||!file.type.match(/^image\/(jpeg|png|webp)$/)||file.size>4*1024*1024){status('JPEG・PNG・WebPの4MB以下の画像を選んでください');return}const reader=new FileReader();reader.onload=()=>cb(String(reader.result));reader.readAsDataURL(file)}
$('mvSelect').onclick=()=>$('mvFile').click();$('mvFile').onchange=e=>readImage(e.target.files[0],data=>{mvData=data;updateMv();autoSave()});$('mvRemove').onclick=()=>{mvData='';updateMv();autoSave()};
$('imageBtn').onclick=()=>$('bodyImageFile').click();$('bodyImageFile').onchange=e=>readImage(e.target.files[0],data=>{const img=document.createElement('img');img.src=data;img.alt='';$('editor').append(img);autoSave()});
for(const b of document.querySelectorAll('[data-command]'))b.onclick=()=>{const c=b.dataset.command;$('editor').focus();if(c==='bold')document.execCommand('bold');else document.execCommand('formatBlock',false,c==='heading'?'h2':'p');autoSave()};
$('linkBtn').onclick=()=>{const url=prompt('リンク先のURL（https://）');if(!url||!/^https:\/\//i.test(url))return;$('editor').focus();document.execCommand('createLink',false,url);autoSave()};
$('undoBtn').onclick=()=>{$('editor').focus();document.execCommand('undo');autoSave()};
$('editor').addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
$('title').addEventListener('input',autoSave);$('editor').addEventListener('input',autoSave);$('save').onclick=save;
$('previewBtn').onclick=()=>{const active=document.body.classList.toggle('is-preview');$('previewBtn').textContent=active?'編集に戻る':'プレビュー';if(active){$('previewTitle').textContent=$('title').value||'無題';$('previewBody').innerHTML=safeHTML($('editor').innerHTML);$('previewMv').replaceChildren();if(mvData){const img=new Image();img.src=mvData;img.alt='';img.style.cssText='display:block;width:100%;aspect-ratio:1.35;object-fit:cover';$('previewMv').append(img)}$('previewDate').textContent=new Date().toLocaleDateString('ja-JP')}}; 
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='youmore-essay-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
})();
</script></body></html>
