<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffe9"><title>ゆうもれ</title>
<style>
:root{--cream:#ffffe9;--ink:#161616}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink)}a{color:inherit}
.rose-bg{position:fixed;inset:0;z-index:-2;background:#a79b87 url("assets/rose-photo.png") center center/cover no-repeat}
.rose-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0002,transparent 70%);pointer-events:none}
.site{position:relative;overflow:hidden;min-height:205vh}
.cream-top{position:absolute;top:0;left:0;right:0;height:clamp(190px,24vw,300px);background:var(--cream);clip-path:polygon(0 0,100% 0,100% 100%,0 33%);z-index:1}
.cream-bottom{position:absolute;top:clamp(480px,68vw,800px);left:-12%;width:124%;height:clamp(220px,35vw,460px);background:var(--cream);border-radius:50% 50% 43% 55%/36% 47% 53% 52%;transform:rotate(8deg);z-index:2}
.header{position:relative;z-index:7;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(20px,5vw,50px) clamp(25px,6vw,70px)}
.logo{font-size:clamp(65px,13vw,155px);font-weight:900;line-height:1;letter-spacing:-.14em;text-decoration:none;white-space:nowrap}.menu{border:0;background:none;cursor:pointer;width:85px;padding:0;display:grid;gap:10px;margin-top:6px}.menu span{height:3px;background:#161616;width:100%}.menu span:nth-child(2){width:84%;justify-self:center}
.portrait{position:absolute;z-index:3;top:clamp(190px,23vw,285px);left:7%;width:clamp(220px,36vw,430px);max-width:45%;filter:drop-shadow(0 3px 1px #0003);pointer-events:none}.portrait img{display:block;width:100%;height:auto}
.links{position:absolute;z-index:6;left:7.5%;top:clamp(550px,65vw,780px);display:grid;gap:18px}.links a{font-family:Georgia,serif;font-size:clamp(21px,3vw,35px);text-underline-offset:4px}
.dot{position:absolute;z-index:5;background:red;border-radius:50%;pointer-events:none}.dot.one{top:clamp(430px,48vw,570px);left:34%;width:clamp(145px,26vw,260px);aspect-ratio:1}.dot.two{top:clamp(840px,95vw,1120px);left:10%;width:clamp(90px,14vw,145px);aspect-ratio:1}
.next{position:relative;z-index:3;margin-top:115vh;padding:30vh 8% 24vh;background:linear-gradient(transparent,#ffffe9 25%);min-height:95vh}.next h2{font-size:clamp(48px,10vw,120px);margin:0 0 30px}.next p{font-size:17px;line-height:2}.next a{display:inline-block;margin:20px 25px 0 0}
[data-speed]{will-change:transform}
@media(max-width:650px){.site{min-height:190vh}.cream-top{height:210px;clip-path:polygon(0 0,100% 0,100% 100%,0 52%)}.header{padding:40px 6%}.logo{font-size:clamp(58px,13vw,90px)}.menu{width:45px;gap:7px}.menu span{height:2px}.portrait{top:205px;left:8%;max-width:none;width:43%}.dot.one{top:390px;left:36%;width:25vw}.links{top:555px;left:8%}.links a{font-size:23px}.cream-bottom{top:630px;height:220px}.dot.two{top:780px}.next{margin-top:105vh}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-speed]{will-change:auto}}
</style></head>
<body><div class="rose-bg" aria-hidden="true"></div><main class="site">
<div class="cream-top" data-speed=".12"></div>
<header class="header"><a class="logo" href="index.html" aria-label="ゆうもれ ホーム">ゆうもれ</a><button class="menu" aria-label="メニュー" aria-controls="category-links" aria-expanded="false"><span></span><span></span><span></span></button></header>
<div class="portrait" data-speed=".22"><img src="assets/character.png" onerror="this.onerror=null;this.src='assets/hero.png'" alt="顔に『ゆ』のある人物のイラスト"></div>
<div class="dot one" data-speed="-.14"></div>
<nav id="category-links" class="links" aria-label="カテゴリー"><a href="blog.html">Link1</a><a href="photo.html">Link2</a><a href="illustration.html">Link3</a></nav>
<div class="cream-bottom" data-speed=".08"></div><div class="dot two" data-speed="-.22"></div>
<section class="next" id="more"><h2>ゆうもれ</h2><p>ことばも、写真も、イラストも、音楽も。<br>ここに、すこしずつ。</p><a href="blog.html">BLOG</a><a href="photo.html">PHOTO</a><a href="illustration.html">ILLUST</a><a href="music.html">MUSIC</a></section>
</main><script>
const layers=[...document.querySelectorAll('[data-speed]')];let ticking=false;function update(){const y=window.scrollY;for(const el of layers)el.style.transform='translate3d(0,'+(y*Number(el.dataset.speed))+'px,0)';ticking=false}if(!matchMedia('(prefers-reduced-motion: reduce)').matches){addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});update()}
document.querySelector('.menu').addEventListener('click',e=>{document.getElementById('category-links').scrollIntoView({behavior:'smooth',block:'center'});e.currentTarget.setAttribute('aria-expanded','true')});
</script></body></html>
