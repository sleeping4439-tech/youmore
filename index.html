<style>
:root{--cream:#ffffe9;--ink:#20211d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}a{color:inherit}button{font:inherit}a:focus-visible,button:focus-visible{outline:3px solid #b82a20;outline-offset:8px}.skip{position:fixed;top:-100px;left:16px;z-index:30;background:var(--cream);padding:12px}.skip:focus{top:16px}
.rose-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#a79b87 url('assets/rose-photo.png?v=20261026') 60% center/cover no-repeat}
.site{position:relative;z-index:1;overflow:hidden}.hero{position:relative;height:max(680px,106vw);max-height:1400px;isolation:isolate}.cream{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:var(--cream)}.cream-top{z-index:1}.cream-bottom{z-index:3}.header{position:absolute;inset:0 0 auto;z-index:7;display:flex;align-items:flex-start;justify-content:space-between;padding:4.8% 4.5%}.logo{font-size:clamp(64px,16vw,230px);font-weight:900;line-height:1.06;letter-spacing:-.1em;text-decoration:none;white-space:nowrap}.menu{margin-top:0;width:10%;max-width:100px;min-width:44px;height:64px;padding:8px 0;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.menu span{height:3px;width:100%;background:var(--ink)}.menu span:nth-child(2){width:74%;align-self:center}
.portrait{position:absolute;z-index:2;left:4%;top:20%;width:43%;pointer-events:none}.portrait img{display:block;width:100%;height:auto}.dot{position:absolute;z-index:4;background:#ff0800;border-radius:50%;aspect-ratio:1;pointer-events:none}.dot.one{top:50.5%;left:33.3%;width:26%}.dot.two{top:84.5%;left:10.8%;width:14%}.links{position:absolute;z-index:6;top:61%;left:7.6%;display:grid;gap:14px}.links a{font-family:Georgia,serif;font-size:clamp(18px,2.8vw,36px);text-underline-offset:5px;text-decoration-thickness:1px;width:fit-content}.links a:hover{color:#b82a20}
.next{position:relative;z-index:5;margin-top:8vw;padding:100px 8% 120px;background:var(--cream)}.next h2{font-size:clamp(48px,8vw,110px);letter-spacing:-.08em;margin:0 0 28px}.next p{font-size:17px;line-height:2}.next nav{display:flex;flex-wrap:wrap;gap:24px;margin-top:35px}.next a{text-underline-offset:5px}.footer{margin-top:90px;font-size:12px}
.menu-panel{position:fixed;inset:0;z-index:20;border:0;margin:auto;padding:80px 10%;width:min(600px,90vw);background:var(--cream);color:var(--ink)}.menu-panel::backdrop{background:#18181099}.menu-panel nav{display:grid;gap:26px}.menu-panel a{font-size:32px;text-underline-offset:7px}.close-menu{position:absolute;top:20px;right:24px;border:0;background:transparent;cursor:pointer;padding:12px;font-size:18px}[data-speed]{will-change:transform}
@media(max-width:600px){.hero{height:max(480px,120vw)}.header{padding:7% 5%}.logo{font-size:16vw}.menu{height:37px;padding:2px 0}.menu span{height:2px}.portrait{top:21%;left:1%;width:58%}.dot.one{top:51%;left:34%;width:27%}.links{top:61%;gap:13px}.links a{font-size:21px}.dot.two{top:87%;width:15%}.rose-bg{background-position:62% center}.next{padding:72px 8% 80px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-speed]{will-change:auto}}
</style>
</head>
<body>

<script>
const layers=[...document.querySelectorAll('[data-speed]')],motion=matchMedia('(prefers-reduced-motion: reduce)');let ticking=false;
function update(){const y=motion.matches?0:Math.min(window.scrollY,document.querySelector('.hero').offsetHeight);for(const el of layers)el.style.transform=`translate3d(0,${y*Number(el.dataset.speed)}px,0)`;ticking=false}
function schedule(){if(!ticking){ticking=true;requestAnimationFrame(update)}}addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);motion.addEventListener('change',schedule);update();
const menu=document.querySelector('.menu'),panel=document.querySelector('.menu-panel');menu.addEventListener('click',()=>{panel.showModal();menu.setAttribute('aria-expanded','true')});document.querySelector('.close-menu').addEventListener('click',()=>panel.close());panel.addEventListener('close',()=>{menu.setAttribute('aria-expanded','false');menu.focus()});panel.addEventListener('click',e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)panel.close()}});
</script></body></html>
