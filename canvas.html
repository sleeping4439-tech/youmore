<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e7ded6"><title>試 / CANVAS — ゆうもれ</title>
<style>
:root{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:#242321;background:#e7ded6}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,5vw,70px);border-bottom:1px solid #c9c0b5}header a{text-decoration:none;font-size:13px;letter-spacing:.15em}main{max-width:1080px;margin:auto;padding:48px 20px 100px}.eyebrow{font-size:13px;letter-spacing:.25em;color:#b21a2d}h1{font-size:clamp(46px,10vw,112px);font-weight:300;line-height:1.1;margin:12px 0}h1 span{font-size:clamp(17px,3vw,32px);vertical-align:middle;letter-spacing:.15em;margin-left:20px}p{font-size:14px;letter-spacing:.08em}.paper{position:relative;background:#faf8f0;box-shadow:0 6px 30px #2a21141c;border:1px solid #e1d9cb;margin-top:35px}.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 31px,#897c6810 32px)}canvas{display:block;width:100%;height:auto;aspect-ratio:1.4;touch-action:none;cursor:crosshair;position:relative}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}.colors{display:flex;gap:10px}.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.colors button[aria-pressed=true]{outline:2px solid #27221e;outline-offset:3px}.tools button.action{padding:12px 19px;border:1px solid #27221e;background:transparent;color:#27221e;cursor:pointer}.tools button.primary{background:#b50017;border-color:#b50017;color:white;margin-left:auto}small{display:block;margin-top:18px;color:#736a61;line-height:1.8}#status{min-height:1.5em}@media(max-width:650px){main{padding-top:30px}.tools button.primary{margin-left:0}canvas{aspect-ratio:0.85}}
</style></head><body><header><a href="index.html">ゆうもれ</a><a href="index.html">トップへ戻る</a></header><main><div class="eyebrow">試 / CANVAS</div><h1>試<span>CANVAS</span></h1><p>ご自由に試し書きください。</p><div class="paper"><canvas id="sheet" aria-label="試し書き用の紙"></canvas></div><div class="tools"><div class="colors" role="group" aria-label="ペンの色"><button type="button" data-color="#252525" aria-label="黒" aria-pressed="true" style="background:#252525"></button><button type="button" data-color="#ad2334" aria-label="赤" aria-pressed="false" style="background:#ad2334"></button><button type="button" data-color="#2f4b85" aria-label="青" aria-pressed="false" style="background:#2f4b85"></button></div><button type="button" class="action" id="undo">ひとつ戻す</button><button type="button" class="action" id="clear">書き直す</button><button type="button" class="action primary" id="save">残す</button></div><p id="status" role="status"></p><small>現在は試作版です。「残す」でこの端末のブラウザに保存されます。ほかの訪問者との共有はまだできません。</small></main>
<script>
(()=>{const canvas=document.querySelector('#sheet'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let color='#252525',drawing=false,strokes=[],active=null;const key='youmore-canvas-local-v1';try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))strokes=saved.filter(s=>Array.isArray(s.points)&&typeof s.color==='string').slice(-1000)}catch{}function size(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render()}function drawStroke(s){if(!s.points.length)return;const w=canvas.clientWidth,h=canvas.clientHeight;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();s.points.forEach((p,i)=>{if(i===0)ctx.moveTo(p[0]*w,p[1]*h);else ctx.lineTo(p[0]*w,p[1]*h)});if(s.points.length===1){ctx.arc(s.points[0][0]*w,s.points[0][1]*h,1.1,0,Math.PI*2);ctx.fill()}else ctx.stroke()}function render(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);strokes.forEach(drawStroke);if(active)drawStroke(active)}function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;drawing=true;canvas.setPointerCapture(e.pointerId);active={color,points:[point(e)]};render()});canvas.addEventListener('pointermove',e=>{if(!drawing||!active)return;active.points.push(point(e));render()});function end(){if(!drawing)return;drawing=false;if(active)strokes.push(active);active=null;render()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));document.querySelector('#undo').addEventListener('click',()=>{strokes.pop();render();status.textContent='' });document.querySelector('#clear').addEventListener('click',()=>{strokes=[];render();status.textContent='書き直せます。'});document.querySelector('#save').addEventListener('click',()=>{try{localStorage.setItem(key,JSON.stringify(strokes));status.textContent='この端末に残しました。共有機能は準備中です。'}catch{status.textContent='保存できませんでした。ブラウザの設定をご確認ください。'}});new ResizeObserver(size).observe(canvas);size()})();
</script></body></html>
