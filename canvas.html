<style>
:root{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:#242321;background:#e7ded6}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,5vw,70px);border-bottom:1px solid #c9c0b5}header a{text-decoration:none;font-size:13px;letter-spacing:.15em}main{max-width:1080px;margin:auto;padding:48px 20px 100px}.eyebrow{font-size:13px;letter-spacing:.25em;color:#b21a2d}h1{font-size:clamp(46px,10vw,112px);font-weight:300;line-height:1.1;margin:12px 0}h1 span{font-size:clamp(17px,3vw,32px);vertical-align:middle;letter-spacing:.15em;margin-left:20px}p{font-size:14px;letter-spacing:.08em}.paper{position:relative;background:#faf8f0;box-shadow:0 6px 30px #2a21141c;border:1px solid #e1d9cb;margin-top:35px}.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 31px,#897c6810 32px)}canvas{display:block;width:100%;height:auto;aspect-ratio:3;touch-action:none;cursor:zoom-in;position:relative}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}.colors{display:flex;gap:10px}.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.colors button[aria-pressed=true]{outline:2px solid #27221e;outline-offset:3px}.tools button.action{padding:12px 19px;border:1px solid #27221e;background:transparent;color:#27221e;cursor:pointer}.tools button.primary{background:#b50017;border-color:#b50017;color:white;margin-left:auto}small{display:block;margin-top:18px;color:#736a61;line-height:1.8}#status{min-height:1.5em}@media(max-width:650px){main{padding-top:30px}.tools button.primary{margin-left:0}canvas{aspect-ratio:3}}
button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #2f4b85;outline-offset:4px}canvas.detail{aspect-ratio:1.4;cursor:crosshair}.view-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}.view-tools button{padding:10px 16px;border:1px solid #736a61;background:transparent;color:inherit;cursor:pointer}.view-tools p{font-size:12px;margin:0;line-height:1.6}canvas:focus-visible{outline:2px solid #2f4b85;outline-offset:2px}</style></head><body><header><a href="index.html">ゆうもれ</a><a href="index.html">トップへ戻る</a></header><main><div class="eyebrow">試 / CANVAS</div><h1>試<span>CANVAS</span></h1><p>ご自由に試し書きください。</p><div class="view-tools"><button id="overview" type="button" disabled>全体を見る</button><p id="view-hint" role="status">書きたい場所をタップして拡大</p></div><div class="paper"><canvas id="sheet" tabindex="0" aria-label="横長の紙：書きたい場所をタップして拡大"></canvas></div><div class="tools"><div class="colors" role="group" aria-label="ペンの色"><button type="button" data-color="#252525" aria-label="黒" aria-pressed="true" style="background:#252525"></button><button type="button" data-color="#ad2334" aria-label="赤" aria-pressed="false" style="background:#ad2334"></button><button type="button" data-color="#2f4b85" aria-label="青" aria-pressed="false" style="background:#2f4b85"></button></div><button type="button" class="action" id="undo">ひとつ戻す</button><button type="button" class="action" id="clear">書き直す</button><button type="button" class="action primary" id="save">残す</button></div><p id="status" role="status"></p><small>「残す」を押すと、みんなの紙に加わります。書き直せるのは、まだ残していない線だけです。<br>毎週月曜0:00（日本時間）に白紙になります。過去の紙は公開・アーカイブしません。</small></main>
